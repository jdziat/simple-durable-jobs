services:
  worker:
    build:
      context: .
      dockerfile: chaostest.Dockerfile
    environment:
      TEST_MYSQL_URL: root:jobs@tcp(mysql:3306)/jobs_test?parseTime=true
      # Torture knobs, inherited from the invoking shell (scripts/torture-test.sh).
      # Defaults reproduce the baseline chaos workload, so chaos-test.sh is unaffected.
      CHAOS_SCALE: ${CHAOS_SCALE:-1.0}
      CHAOS_FANOUT_WIDTH: ${CHAOS_FANOUT_WIDTH:-5}
      CHAOS_DRAIN_TIMEOUT: ${CHAOS_DRAIN_TIMEOUT:-120s}
      CHAOS_WINDOW_GAP: ${CHAOS_WINDOW_GAP:-0s}
      CHAOS_SEED_UNIT: ${CHAOS_SEED_UNIT:-}
      CHAOS_SEED_PIPELINE: ${CHAOS_SEED_PIPELINE:-}
      CHAOS_SEED_PIPELINE_WINDOW: ${CHAOS_SEED_PIPELINE_WINDOW:-}
      CHAOS_SEED_FANOUT: ${CHAOS_SEED_FANOUT:-}
      CHAOS_SEED_SLOW: ${CHAOS_SEED_SLOW:-}
      CHAOS_SEED_MEGAFLOW: ${CHAOS_SEED_MEGAFLOW:-}
      CHAOS_SEED_UNIQUE_ATTEMPTS: ${CHAOS_SEED_UNIQUE_ATTEMPTS:-}
      CHAOS_SEED_WINDOWED_ATTEMPTS: ${CHAOS_SEED_WINDOWED_ATTEMPTS:-}
      CHAOS_SEED_SIGNAL_WAITERS: ${CHAOS_SEED_SIGNAL_WAITERS:-}
      CHAOS_SEED_TIMER: ${CHAOS_SEED_TIMER:-}
    depends_on:
      mysql:
        condition: service_healthy
    command: ["worker"]
