version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. They are pinned to commit SHAs in
  # the workflows for supply-chain safety and reproducibility; Dependabot bumps
  # the SHA (and the trailing # vX.Y.Z comment) when a new release ships.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep Go module dependencies current. This exists because govulncheck is a
  # RELEASE-BLOCKING gate (ci.yml's release job lists it in `needs`), and a
  # failing gate manifests as a SKIPPED release rather than a failed one — so a
  # newly-published advisory silently wedges the pipeline until someone notices.
  # Bumping on a schedule keeps the floor current so the gate fires during
  # routine maintenance instead of ambushing an unrelated hotfix.
  #
  # prefix "fix" is load-bearing: semantic-release cuts a PATCH from a `fix:`
  # subject, which raises the dependency floor for consumers who do not pin.
  # Both update classes are grouped to "*" so routine churn is capped at one PR
  # (and therefore at most one patch tag) per week.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      gomod-security:
        applies-to: security-updates
        patterns:
          - "*"
      gomod:
        applies-to: version-updates
        patterns:
          - "*"
