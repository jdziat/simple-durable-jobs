name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

# CI pins Go to 1.25.12 (matches go.mod's `toolchain` directive) so setup-go
# installs it directly: no on-the-fly sum.golang.org toolchain download
# (which flaked Lint) and CI runs the patched stdlib. Bump with go.mod.

jobs:
  test-backends:
    name: Tests (${{ matrix.label }})
    runs-on: ubuntu-latest

    # One parallel job per backend. Each builds the test image (frontend assets
    # + Go toolchain + source) and runs the suite in a container via docker
    # compose. fail-fast is off so a failure in one backend doesn't cancel the
    # others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: sqlite
            db: ""
            label: sqlite
          - backend: postgres
            db: postgres
            label: postgres
          - backend: mysql
            db: mysql
            label: mysql
          # A NON-UTC leg, and specifically a NEGATIVE-offset one.
          #
          # Every runner here is UTC, and this repo has at least five test files
          # whose whole subject is that a stored timestamp must not wear the
          # writer's local clock face. On SQLite those columns are TEXT and are
          # compared LEXICALLY, so a "...-07:00" write mis-sorts against a UTC
          # cutoff — but under TZ=UTC there is no offset to mis-sort, and every one
          # of those guards is VACUOUSLY GREEN. zz_r29_order_test.go says so in its
          # own comment.
          #
          # That is how a concurrency-slot sweep shipped that deleted live slot rows
          # in any negative-offset zone, silently collapsing every ConcurrencyCap:
          # the class had tests, and CI could not run them meaningfully.
          #
          # Negative offset is the load-bearing part — a positive one (+02:00) sorts
          # ABOVE a UTC cutoff and passes even when the bug is present.
          #
          # SQLite only: Postgres and MySQL route both ends through the server clock
          # (useDBClock), so the hazard does not exist there and a second DB leg
          # would cost CI minutes to prove nothing.
          - backend: sqlite
            db: ""
            label: "sqlite, TZ=America/Los_Angeles"
            tz: America/Los_Angeles
          # And a POSITIVE offset, with a half-hour component.
          #
          # One negative leg is not enough, and the reason is specific: a negative
          # offset catches a stored-local value sorting BELOW a UTC cutoff (a live
          # row swept, a cap that stops capping). A positive offset catches the
          # opposite — a value sorting ABOVE it, so an EXPIRED row is never
          # collected and blocks its slot forever. Those are different defects, and
          # normalizing a write to UTC can FIX the first while INTRODUCING the
          # second on any database that already has rows.
          #
          # Two shipped tests were red at +05:30 while green at UTC and -07:00, so
          # this is not hypothetical. :30 rather than a whole hour because the
          # trailing "+HH:MM" is compared with its minutes, and a whole-hour zone
          # cannot catch a predicate that slices the offset wrong.
          - backend: sqlite
            db: ""
            label: "sqlite, TZ=Asia/Kolkata"
            tz: Asia/Kolkata

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build test image
        run: docker compose build tests

      # SQLite is in-process and needs no service; the DB backends start only
      # the one they need (--no-deps on the run keeps the other from starting).
      - name: Start database
        if: matrix.db != ''
        run: docker compose up -d --wait ${{ matrix.db }}

      - name: Run tests
        # TZ defaults to UTC so the three original legs are unchanged. tzdata ships
        # in the Debian-based golang image, so a named zone really takes effect —
        # without it the setting would silently fall back to UTC and this leg would
        # be vacuous in exactly the way it exists to prevent.
        run: >-
          docker compose run --rm --no-deps
          -e TZ=${{ matrix.tz || 'UTC' }}
          tests ${{ matrix.backend }}

      - name: Stop database
        if: always() && matrix.db != ''
        run: docker compose down -v

      # Coverage is dialect-split, so upload each backend's profile as an
      # artifact and let the `coverage` job merge them before sending the
      # combined result to Codecov (a single-backend profile understates the
      # storage layer's real coverage).
      - name: Upload coverage artifact
        # TWO conditions, one key. always() is the original: upload the profile even
        # when the tests failed, so a red run still reports coverage. matrix.tz == ''
        # is the new half: the non-UTC leg is the SAME backend running the SAME
        # tests, so it adds no covered lines — and upload-artifact@v4 FAILS on a
        # duplicate artifact name, which "coverage-sqlite" would be.
        #
        # They must be ANDed into a single `if:`. Written as two `if:` keys this is a
        # duplicate mapping key: a strict YAML loader rejects the whole workflow, and
        # a lenient one silently keeps only the last — which drops the guard and
        # reintroduces the very collision the comment claims to prevent.
        if: always() && matrix.tz == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.backend }}
          path: ./coverage/coverage-${{ matrix.backend }}.out
          if-no-files-found: warn

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-backends]
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'

      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-raw
          merge-multiple: true

      - name: Merge backend coverage profiles
        run: |
          shopt -s nullglob
          files=(coverage-raw/coverage-*.out)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no coverage profiles found; skipping merge"
            exit 0
          fi
          go run github.com/wadey/gocovmerge@v0.0.0-20160331181800-b5bfa59ec0ad "${files[@]}" > coverage-merged.out
          echo "Merged coverage:"
          go tool cover -func=coverage-merged.out | tail -1

      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage-merged.out
          fail_ci_if_error: false

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: ui/frontend
        run: npm ci && npm run build

      - name: Download Go dependencies
        run: go mod download

      - name: Install Playwright
        working-directory: ui/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ui/frontend
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: ui/frontend/playwright-report/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the upgrade-matrix step below can resolve the previous
      # release tag; the default shallow clone carries no tags at all.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # A committed conflict marker had NO gate: `go build/vet/test ./...` covers
      # only the root module, so docs/ (its own go.mod) is never compiled, and
      # Hugo renders a conflict marker as ordinary text without erroring — so
      # pages.yml would have published it to the live docs site on merge. It
      # happened: markers survived a release-branch merge into two published
      # pages, and one of them put `return err` inside `func main()`.
      #
      # The pattern is anchored to line start, and is BUILT rather than written
      # literally so this file is scanned like any other — an earlier version
      # excluded this workflow to stop the comment self-tripping, which meant a
      # real marker here would never have been found.
      #
      # FAILS CLOSED: git grep exits 0 on a match, 1 on none, and >1 on an actual
      # error. Only 1 is a pass; anything else fails the build rather than being
      # silently read as "clean".
      #
      # KNOWN FALSE POSITIVE, accepted knowingly: a Markdown setext heading
      # underlined with EXACTLY seven `=` is indistinguishable from a conflict
      # marker at this level, and the Hugo docs this gate protects are Markdown.
      # Eight or more is fine, which will look arbitrary to whoever hits it. It
      # fails closed (a confusing red build, never a silent pass), so it is left as
      # is rather than made cleverer; if you hit it, use a `##` heading.
      - name: No committed conflict markers
        run: |
          set -uo pipefail
          pat="^($(printf '<%.0s' $(seq 7))|$(printf '=%.0s' $(seq 7))|$(printf '>%.0s' $(seq 7)))( |$)"
          # errexit OFF around the scan: GitHub runs steps as `bash -e`, and
          # git grep exits 1 for "no match", which would kill the step before
          # $? could be read — reporting a clean tree as a failure.
          set +e
          # ui/frontend/dist is NOT excluded. It is tracked and //go:embed'd, so a
          # marker there ships inside the module zip and breaks the dashboard
          # bundle for every consumer — the one place a marker does the most damage
          # is the last place to skip.
          git grep -nE "$pat" -- .
          status=$?
          set -e
          case "$status" in
            0) echo "::error::unresolved merge-conflict markers are committed (listed above)"; exit 1 ;;
            1) echo "no conflict markers" ;;
            *) echo "::error::conflict-marker scan failed (git grep exit $status)"; exit "$status" ;;
          esac

      # A Go module zip contains EVERY file under the module root, so anything
      # tracked here is downloaded by every `go get` -- and module versions are
      # IMMUTABLE in the proxy, so a mistake cannot be withdrawn afterwards, only
      # superseded. .gitignore alone cannot prevent this because it only covers
      # names someone predicted.
      #
      # It classifies by scanning for a NUL byte, which is the same heuristic git
      # uses but without git's attribute layer on top. HONEST LIMIT: a binary
      # containing no NUL at all is not detected by content — the size gate below
      # is the backstop for that, and the extension allowlist means an ELF named
      # `logo.png` also passes. This is a good filter, not a proof.
      #
      # The first version of this step matched a LIST of magic bytes (ELF, Mach-O,
      # PE, ar, wasm). That reproduced the very flaw it criticised .gitignore for:
      # one commit later a 221 KB `sqlite.db.tmp` was committed at the module root
      # and this step passed green, because "SQLite format 3" was not a format
      # anyone had thought to list.
      #
      # So it is INVERTED: git itself decides what is binary (`git grep -I`, the
      # same NUL-byte heuristic used for diffs), and only an explicit allowlist of
      # asset extensions is permitted. An unrecognised binary format is now a
      # failure by default rather than a pass by default. Adding a genuine new
      # asset type means adding it here, on purpose.
      - name: No committed binaries outside the asset allowlist
        run: |
          set -uo pipefail
          found=""
          # -z / read -d '': without them git C-QUOTES any path containing a
          # non-ASCII or control character, emitting the literal "sub/caf\303\251.bin".
          # [ -f "$f" ] then fails on that string and the loop skips the file --
          # so the guard was evadable by FILENAME, which is the same
          # "only covers what someone predicted" flaw it was rewritten to fix,
          # moved from formats to paths. Reproduced with identical ELF bytes under
          # two names: the ASCII one was caught, the accented one passed.
          while IFS= read -r -d '' f; do
            # SYMLINKS FIRST: -f dereferences, so a link to /bin/ls looks like a
            # regular file, while `git grep -I` does not search link entries at all
            # and its "no match" reads as "binary". A committed symlink would red
            # the release with a message naming the wrong problem.
            [ -L "$f" ] && continue
            [ -f "$f" ] || continue
            # An EMPTY file has no character to match, so the grep below would call
            # it binary and red the Lint job over a .gitkeep. Skip zero-byte files
            # explicitly: they cannot be a compiled artifact.
            [ -s "$f" ] || continue
            case "$f" in
              *.png|*.jpg|*.jpeg|*.gif|*.ico|*.webp|*.woff|*.woff2|*.ttf|*.otf|*.eot) continue ;;
            esac
            # -I treats binary files as non-matching, so a file with NO match is
            # one git considers binary. The pattern is "^" (start of line), which
            # every line of every text file has -- "." would miss a file that is
            # only blank lines and report it as binary.
            # Scan the BYTES; do not ask git. `git grep -I` consults the `diff`
            # gitattribute before its own NUL heuristic, so the same commit that
            # carries a payload can reclassify it: one line of `* diff` in
            # .gitattributes made a committed ELF pass cleanly, and `path -diff`
            # made a 22-byte text file red the build. A guard whose verdict the
            # committer controls is not a guard. This also removes three separate
            # filename evasions the git delegation kept producing (C-quoted paths,
            # glob pathspecs, leading dashes) — `--` and a direct read have no
            # such surface.
            #
            # NUL-in-file is the classifier. NOT `grep -P '\x00'`: PCRE cannot
            # match NUL in several grep builds, so that silently matches nothing
            # and the check passes on everything — a detector that is inert is
            # worse than none.
            # Bounded read. The size gate below rejects anything over 1 MiB, so a
            # file that reaches here is small — but ordering is not a guarantee, and
            # `cat`ing a hypothetical 300 MB blob twice would stall the Lint job
            # before the size gate ever ran. head -c bounds it explicitly.
            sz=$(stat -c%s -- "$f")
            [ "$sz" -gt 1048576 ] && continue   # the size gate owns these
            raw=$(head -c 1048576 -- "$f" | wc -c)
            stripped=$(head -c 1048576 -- "$f" | tr -d '\000' | wc -c)
            if [ "$raw" -ne "$stripped" ]; then
              found="$found $f(${sz}B)"
            fi
          done < <(git ls-files -z)
          if [ -n "$found" ]; then
            echo "::error::binary files are committed outside the asset allowlist:$found"
            echo "If one is a genuine asset, add its extension to the allowlist in this step."
            exit 1
          fi
          echo "no committed binaries outside the asset allowlist"

          # SIZE, not just format. The incident this whole step exists for was
          # module-zip inflation -- a 14.5 MB binary, 7.7x -- and a committed 14 MB
          # of TEXT (a JSON dump, a base64 payload, a giant fixture) does the same
          # damage while passing every check above. Module versions are IMMUTABLE
          # in the proxy, so it cannot be withdrawn afterwards.
          big=""
          while IFS= read -r -d '' f; do
            [ -L "$f" ] && continue
            [ -f "$f" ] || continue
            sz=$(stat -c%s -- "$f")
            if [ "$sz" -gt 1048576 ]; then big="$big $f($((sz/1024))KiB)"; fi
          done < <(git ls-files -z)
          if [ -n "$big" ]; then
            echo "::error::files over 1 MiB are committed:$big"
            echo "Everything tracked here ships in the module zip to every consumer."
            echo "If one is genuinely needed, raise the threshold in this step deliberately."
            exit 1
          fi
          echo "no committed file over 1 MiB"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: ui/frontend
        run: npm ci && npm run build

      # svelte-check existed as an npm script and NOTHING ran it, so TypeScript
      # errors in the dashboard shipped silently — the same "present, and
      # load-bearing for nobody" shape as the frontend unit tests below. Four real
      # errors had accumulated in a test file by the time this was added; the tree
      # is at 0 errors / 0 warnings across 428 files as of this commit, so any
      # failure here is new.
      #
      # `vite build` does NOT typecheck (esbuild strips types without checking
      # them), so the build passing says nothing about type correctness. This is
      # the only gate that does.
      - name: Frontend typecheck
        working-directory: ui/frontend
        run: npm run check

      # ui/frontend/dist is COMMITTED and //go:embed'd, so it is what consumers
      # actually get — but nothing ever compared it to its own source. A stale
      # bundle would ship silently through go:embed while CI stayed green, because
      # CI rebuilds from source and tests the REBUILT copy, never the committed
      # one. Same shape as the frontend unit tests that existed but were never run:
      # present, and load-bearing for nobody.
      #
      # The build is deterministic (verified byte-identical across rebuilds, all
      # seven files) and the single committed lockfile is installed with `npm ci`,
      # so a diff here means the committed bundle genuinely does not match its
      # source. (There used to be TWO lockfiles pinning different Svelte
      # compilers, which would have made this gate fail for whichever maintainer
      # did not happen to use the same package manager as CI.)
      - name: Committed frontend bundle matches its source
        run: |
          # `git status --porcelain`, NOT `git diff`: diff only sees TRACKED files,
          # so a brand-new asset the build emits (a favicon, a font) shows up as
          # untracked and the check would pass while go:embed ships the bundle
          # WITHOUT it. That is the exact shape of the favicon bug this same wave
          # fixed, one layer up.
          drift="$(git status --porcelain -- ui/frontend/dist)"
          if [ -n "$drift" ]; then
            echo "::error::ui/frontend/dist does not match a fresh build of its source."
            echo "It is committed and go:embed'd, so the dashboard consumers get is the stale one."
            echo "Fix: (cd ui/frontend && npm run build) and commit the result."
            echo "$drift"
            exit 1
          fi
          echo "committed bundle matches a fresh build"

      # The frontend unit tests existed but NOTHING RAN THEM: no workflow invoked
      # vitest, so every assertion in ui/frontend/src/**/*.test.ts was decorative
      # in CI and a regression there was invisible. That included the RPC base-URL
      # resolution the dashboard's sub-path mount depends on.
      - name: Frontend unit tests
        working-directory: ui/frontend
        run: npm run test:unit

      # Cross-version upgrade guard. Two review rounds running, the worst defects
      # in this line were fixes that were correct against a FRESH database and
      # silently broke deployments whose rows an older binary had written — every
      # ordinary test starts from an empty database, so none of them could see it.
      # This builds the previous release, lets it populate a SQLite file, then
      # points this tree's binary at that same file and checks the schedules still
      # fire. The job's checkout uses fetch-depth 0 so the baseline tag resolves.
      - name: Upgrade matrix (previous release -> HEAD)
        run: ./scripts/upgrade-matrix.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.8.0
          install-mode: binary
          args: --timeout=5m

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'

      # Pinned for reproducibility. govulncheck still fetches the current
      # vulnerability database at runtime, so the pinned binary stays current on
      # advisories; bump the pin deliberately (Dependabot tracks Actions).
      # ./... covers only the root module; docs/ is excluded by its own go.mod.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  api-compat:
    name: api-compat
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so gorelease sees the version tags and infers the correct
      # base version; a shallow clone compares against the wrong tag and fails
      # once a release has been published.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'

      # Enforces VERSIONING.md's v1 stability promise: incompatible changes fail
      # this gate, while additive minor changes are allowed and expected.
      - name: Run gorelease
        run: |
          report_path="${RUNNER_TEMP:-/tmp}/gorelease-report.txt"
          # Pinned (x/exp has no stable releases): the grep below is coupled to
          # gorelease's report format, so a floating @latest could silently turn
          # this gate into a no-op if the header wording ever changes. Bump the
          # pin deliberately and re-verify the grep when updating.
          GORELEASE="golang.org/x/exp/cmd/gorelease@v0.0.0-20260603202125-055de637280b"

          # Major-version-cut detection. At a /vN bump (N>=2) there is no vN.* tag
          # yet, so a BARE gorelease infers no base and passes VACUOUSLY — the gate
          # would protect nothing on the one PR that contains every intended break.
          # On that boundary we instead compare against the previous major's latest
          # tag, PRINT the break ledger for human review, and refuse to pass only if
          # gorelease produced no comparison at all. Incompatible changes are EXPECTED
          # for a major and are NOT failed here. The strict check below re-arms
          # automatically once vN.0.0 is tagged (bare gorelease then finds a vN base).
          module="$(go list -m)"
          major="${module##*/v}"
          case "$major" in (''|*[!0-9]*) major=1 ;; esac
          if [ "$major" -ge 2 ] && ! git tag | grep -qE "^v${major}\."; then
            prev=$((major - 1))
            base="$(git tag | grep -E "^v${prev}\." | sort -V | tail -1)"
            echo "::notice::major-version cut (module=$module, no v${major} tag); break ledger vs ${base:-<none>}:"
            set +e
            go run "$GORELEASE" -base="$base" > "$report_path" 2>&1
            set -e
            cat "$report_path"
            if [ -z "$base" ] || [ ! -s "$report_path" ] || grep -qiE "no previous version|no version to compare|could not" "$report_path"; then
              echo "api-compat: gorelease produced no comparison against '${base:-<none>}' at the major boundary; refusing to pass vacuously."
              exit 1
            fi
            echo "::notice::major-version cut: incompatible changes are EXPECTED; review the ledger above (path-change noise is normal)."
            exit 0
          fi

          # Normal path: enforce VERSIONING.md's stability promise WITHIN the current
          # major — incompatible changes fail, additive minor changes are expected.
          set +e
          go run "$GORELEASE" > "$report_path" 2>&1
          gorelease_status=$?
          set -e

          cat "$report_path"

          if grep -Eiq '(^|[[:space:]])incompatible changes(:|$)' "$report_path"; then
            echo "gorelease found incompatible API changes"
            exit 1
          fi

          exit "$gorelease_status"

  chaos-smoke:
    name: Chaos smoke (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # A short multi-worker crash/recovery run on every PR so regressions in the
    # lock/heartbeat/reaper/ownership paths are caught before merge, not just by
    # the nightly Stress & Chaos workflow. The full PG+MySQL chaos runs nightly.
    env:
      CHAOS_DURATION: "25"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run chaos smoke
        run: bash scripts/chaos-test.sh postgres

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-backends, lint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: ui/frontend
        run: npm ci && npm run build

      - name: Build
        run: go build -v ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    # The trust gates are release-blocking: a vulnerability finding or an
    # incompatible API change must stop the tag, not just fail a check.
    # A HARD crash/recovery invariant failure (chaos-smoke) or a broken
    # embedded-dashboard e2e run (test-e2e) must likewise stop the tag.
    needs: [build, govulncheck, api-compat, chaos-smoke, test-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # Major-bump guard. semantic-release infers a MAJOR only from a breaking
      # marker (a `<type>!:` subject or a `BREAKING CHANGE:` footer). If the module
      # path is already /vN (N>=2) but no vN.* tag exists yet and the commits since
      # the last tag carry NO breaking marker, semantic-release would compute a
      # MINOR and silently mis-tag the major as a v(N-1).x release (the v1.3.0
      # squash-title incident). Fail loudly before tagging so the commit message
      # can be fixed and the run retried.
      - name: Guard the major-version bump
        run: |
          module="$(go list -m)"
          major="${module##*/v}"
          case "$major" in (''|*[!0-9]*) major=1 ;; esac
          if [ "$major" -ge 2 ] && ! git tag | grep -qE "^v${major}\."; then
            last="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
            range="${last:+${last}..}HEAD"
            if ! git log "$range" --format='%s%n%b' \
                 | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE'; then
              echo "::error::module is ${module} (v${major}) but no breaking-change commit since ${last:-<root>}; semantic-release would mis-tag a minor instead of v${major}.0.0. Add a '<type>!:' subject or a 'BREAKING CHANGE:' footer."
              exit 1
            fi
            echo "::notice::major bump guard OK — breaking-change commit present for v${major}.0.0."
          fi

      # Superseded-run guard. Re-running an OLD commit's Release job (e.g.
      # `gh run rerun --failed` on a run that newer commits already descend from)
      # makes go-semantic-release run on a non-tip commit; it then fails to find
      # its last-release ancestor, re-scans history from root, and mints a bogus
      # CROSS-MAJOR tag off accumulated `BREAKING CHANGE:` footers — invalid for a
      # /vN module path (the v5.0.0/v5.0.1 incident, cut from a re-run of #106's
      # Release job). If HEAD is not the current tip of origin/main, SKIP the
      # release; the tip's own Release job releases the lineage. To re-release a
      # failed tip, push a fresh commit rather than re-running the old job.
      - name: Detect a superseded Release run
        id: supersede
        run: |
          git fetch --quiet origin main
          head="$(git rev-parse HEAD)"
          tip="$(git rev-parse origin/main)"
          if [ "$head" != "$tip" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping release — HEAD ${head} is not the tip of origin/main ${tip} (superseded commit / re-run of an old run). go-semantic-release could mint a bogus cross-major tag. Retrigger by pushing a fresh commit to main."
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        if: steps.supersede.outputs.superseded != 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-generator-opt: "emojis=true"
          allow-initial-development-releases: true
